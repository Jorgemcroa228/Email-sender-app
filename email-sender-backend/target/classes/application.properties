# =============================================
# SENDGRID CONFIGURATION
# =============================================
# Reemplaza con tu API Key de SendGrid
# Obtenla en: https://app.sendgrid.com/settings/api_keys
sendgrid.api.key=SG.TU_API_KEY_AQUI

# Correo remitente verificado en SendGrid
sendgrid.from.email=tu-correo@dominio.com
sendgrid.from.name=Email Sender App

# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8080

# =============================================
# SWAGGER / OPENAPI
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================
# LOGGING
# =============================================
logging.level.com.emailsender=DEBUG
logging.level.com.sendgrid=DEBUG
